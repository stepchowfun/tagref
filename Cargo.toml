[package]
name = "tagref"
version = "1.14.0"
edition = "2024"
description = "Manage cross-references in your code."
documentation = "https://github.com/stepchowfun/tagref"
readme = "README.md"
repository = "https://github.com/stepchowfun/tagref"
license = "MIT"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "wrap_help"] }
colored = "3.1.1"
ignore = "0.4.34"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"

[lints]
clippy.all = { level = "deny", priority = -1 }
clippy.default_numeric_fallback = "deny"
clippy.pedantic = { level = "deny", priority = -1 }
rust.warnings = "deny"
